# Publishes the demo build (invented data, no sign-in) to GitHub Pages:
# https://misyuk-t.github.io/worklog-hub/
name: Demo on GitHub Pages

on:
  push:
    branches: [rework]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: react-app/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn test

      - run: yarn build
        env:
          VITE_DEMO: "true"
          VITE_BASE: /worklog-hub/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
