# Publishes the landing page (site/) at https://misyuk-t.github.io/worklog-hub/
# and the demo build (invented data, no sign-in) under /demo/.
name: Site and demo on GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: react-app/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn test

      - run: yarn build
        env:
          VITE_DEMO: "true"
          VITE_BASE: /worklog-hub/demo/

      # _site/ = the landing page at the root, the demo in demo/, the GIFs in media/
      - name: Assemble the site
        working-directory: .
        run: |
          mkdir -p _site/demo
          cp -R site/. _site/
          cp docs/media/*.gif _site/media/
          cp -R react-app/dist/. _site/demo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
